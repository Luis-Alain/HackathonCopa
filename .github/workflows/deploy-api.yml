# CD de WebAppApi → Azure App Service (Linux)
# Auth con publish profile: no requiere app registration en Entra ID.

name: Deploy WebAppApi

on:
  push:
    branches: [main]
    paths:
      - "WebAppApi/**"
      - ".github/workflows/deploy-api.yml"
      - "infra/**"
  pull_request:
    branches: [main]
    paths:
      - "WebAppApi/**"
      - ".github/workflows/deploy-api.yml"
      - "infra/**"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: contacts-api-96968
  PROJECT_PATH: WebAppApi/WebAppApi.csproj
  DOTNET_VERSION: "10.x"

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release --no-build -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: webappapi
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webappapi
          path: ./publish

      - name: Deploy a Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      - name: Smoke test /healthz
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}/healthz"
          echo "Probando $url"
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "Intento $i: HTTP $status"
            [ "$status" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::$url no respondió 200"
          exit 1
